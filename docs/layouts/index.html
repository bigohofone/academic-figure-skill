<style>
/* figures at their printed positions: the gap between the two columns is the page's column gap, so
   single-column and full-width figures line up edge to edge */
.layouts { margin:0 auto 56px; width:calc(6.75in + 1in); padding:0.5in; display:flex; flex-direction:column; gap:28px; background:#fff; border-radius:12px; color:#111; }  /* a white sheet: the page the figures are printed on */
.layouts .pair { display:grid; grid-template-columns:repeat(2, 3.25in); column-gap:0.25in; align-items:start; }
.layouts .col { display:flex; flex-direction:column; gap:28px; }
.layouts figure { margin:0; }
.layouts img { display:block; background:#fff; }
/* captions as in the paper, at print size: 9 pt Times, the lead in bold */
.layouts figcaption { margin-top:6pt; font:9pt/11pt "Times New Roman", Times, serif; color:#111; text-align:justify; hyphens:auto; }
.layouts figcaption b { font-weight:700; }
/* a phone: one column, the figures scaled to the screen (print size does not fit) */
@media (max-width:860px) {
  .layouts { width:auto; margin:0 16px 40px; padding:20px 16px; }
  .layouts .pair { display:flex; flex-direction:column; gap:28px; } .layouts .col { display:contents; }
  .layouts img { max-width:100%; height:auto; }
}
.layouts ul { margin:6px 0 0; padding-left:16px; color:#4d4d4d; font-size:12.5px; }
</style></head><body>
