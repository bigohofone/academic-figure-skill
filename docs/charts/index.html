<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matplotlib &amp; seaborn compatible · academic-figure-skill</title>
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#07080b; --bg2:#0c0e13; --panel:#11141a; --panel2:#161a22; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#f3f4f6; --ink2:#a9afbb; --ink3:#6e7583; --accent:#ff4d63; --accent2:#ff8a5c; --grey:#8a8f99; --card:#11141a; --code:#0b0d11; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
.wrap { max-width:1180px; margin:0 auto; padding:0 24px; }
.mono, pre, .term { font-family:"JetBrains Mono", ui-monospace, monospace; }

/* floating nav */
nav { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10; width:min(820px, calc(100% - 32px));
  display:flex; align-items:center; gap:22px; padding:8px 8px 8px 18px; border:1px solid var(--line2); border-radius:14px;
  background:rgba(12,14,19,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
nav .logo { font-weight:700; text-decoration:none; white-space:nowrap; display:flex; align-items:center; gap:9px; }
nav .logo i { width:18px; height:14px; border:2px solid var(--accent); border-radius:4px; display:inline-block; }
nav .links { display:flex; gap:20px; margin-left:auto; font-size:14.5px; color:var(--ink2); align-items:center; }
nav .links a { text-decoration:none; } nav .links a:hover { color:var(--ink); }

/* hero, framed like a screen */
/* a frame fixed to the window, over everything; the page outside its rounded corners is masked */
.window-frame { position:fixed; inset:10px; border:2px solid var(--accent); border-radius:26px; pointer-events:none; z-index:40;
  box-shadow:0 0 0 40px var(--bg); }
header { padding:150px 0 70px; text-align:center; }
.eyebrow { display:inline-flex; gap:8px; align-items:center; font-size:13px; font-weight:600; color:var(--ink2); border:1px solid var(--line2); padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.03); }
.eyebrow b { color:var(--accent); font-weight:600; }
h1 { font-size:clamp(42px,7.4vw,92px); line-height:1; letter-spacing:-.045em; margin:24px auto 22px; max-width:13ch; font-weight:800; }
h1 em { font-style:normal; color:var(--accent); }
.lead { font-size:clamp(17px,2.1vw,20px); color:var(--ink2); max-width:650px; margin:0 auto; }
.cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:13px 20px; border-radius:12px; font:inherit; font-weight:600; font-size:15px; text-decoration:none; border:1px solid var(--line2); background:rgba(255,255,255,.04); color:var(--ink); cursor:pointer; }
.btn.primary { background:var(--accent); border-color:transparent; color:#fff; }
.btn:hover { transform:translateY(-1px); }
.small-note { font-size:13.5px; color:var(--ink3); margin-top:14px; }
.btn .count, .star .count { padding-left:9px; margin-left:3px; border-left:1px solid var(--line2); color:var(--ink2); font-variant-numeric:tabular-nums; }
.btn svg, .star svg { color:#e3b341; }

/* the demo */
.demo { max-width:1080px; margin:56px auto 0; border:1px solid var(--line2); border-radius:18px; background:#0d1016; box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02); overflow:hidden; text-align:left; }
.chrome { display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
.chrome i { width:11px; height:11px; border-radius:50%; background:#ff5f57; } .chrome i:nth-child(2) { background:#febc2e; } .chrome i:nth-child(3) { background:#28c840; }
.chrome span { margin-left:10px; font:12.5px "JetBrains Mono", monospace; color:var(--ink3); }
.demo-body { display:grid; grid-template-columns:1fr 1.05fr; min-height:400px; }
.term { padding:22px 22px 18px; font-size:13.5px; line-height:1.75; border-right:1px solid var(--line); background:#0a0c10; }
.tl { opacity:0; transform:translateY(4px); transition:opacity .35s ease, transform .35s ease; white-space:pre-wrap; word-break:break-word; color:var(--ink2); }
.tl.on { opacity:1; transform:none; }
.tl.you { color:var(--ink); } .tl.you::before { content:"› "; color:var(--accent); }
.tl.tool::before { content:"⏺ "; color:#7aa2ff; }
.tl.out { padding-left:1.6em; color:var(--ink3); }
.tl.ok { padding-left:1.6em; color:#4ade80; } .tl.ok::before { content:"✓ "; }
.tl.cursor { opacity:1; width:9px; height:17px; background:var(--ink2); animation:blink 1s steps(1) infinite; margin-top:4px; }
@keyframes blink { 50% { opacity:0; } }
.stage { padding:22px; display:flex; flex-direction:column; gap:12px; }
.stage-tag { font-size:13px; font-weight:600; height:20px; position:relative; }
.stage-tag span { position:absolute; inset:0; transition:opacity .5s ease; }
.t-without { color:var(--grey); } .t-with { color:var(--accent); opacity:0; }
.sheet { flex:1; background:#fff; border-radius:10px; display:grid; place-items:center; padding:2%; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.45); }
.sheet img { grid-area:1/1; width:100%; max-width:520px; height:auto; transition:opacity .7s ease, filter .7s ease; }
.s-with { opacity:0; }
.demo.done .s-with, .demo.done .t-with { opacity:1; } .demo.done .s-without, .demo.done .t-without { opacity:0; }
.stage-cap { margin:0; font:12px/1.45 Inter, system-ui, sans-serif; color:var(--ink2); opacity:0; transition:opacity .5s ease; }
.demo.done .stage-cap { opacity:1; }
.timeline { list-style:none; margin:0; padding:14px 16px; display:flex; gap:8px; border-top:1px solid var(--line); overflow-x:auto; }
.timeline li { flex:1; min-width:110px; font-size:12.5px; color:var(--ink3); border:1px solid var(--line); border-radius:9px; padding:7px 10px; display:flex; align-items:center; gap:8px; transition:all .3s ease; white-space:nowrap; }
.timeline li span { width:7px; height:7px; border-radius:50%; background:var(--ink3); }
.timeline li.on { color:var(--ink); border-color:rgba(255,77,99,.45); background:rgba(255,77,99,.08); } .timeline li.on span { background:var(--accent); box-shadow:0 0 10px var(--accent); }

/* venues strip */
.strip { padding:44px 0 54px; text-align:center; }
.strip p { font-size:14px; color:var(--ink3); margin:0 0 18px; }
.strip ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:14px 48px; }
.strip li { font-size:24px; font-weight:700; letter-spacing:-.02em; color:#59606d; }

/* sections */
section { padding:110px 0; }
.sec-head { text-align:center; max-width:760px; margin:0 auto 46px; }
.label { display:inline-block; font:500 12.5px "JetBrains Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
h2 { font-size:clamp(32px,5vw,58px); letter-spacing:-.04em; line-height:1.03; margin:0 0 16px; font-weight:800; }
h2 em { font-style:normal; color:var(--ink3); }
.intro { color:var(--ink2); font-size:18px; margin:0; }
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.step, .feature, .ex, .faq details { background:var(--panel); border:1px solid var(--line); border-radius:18px; }
.step { padding:26px; display:flex; flex-direction:column; gap:12px; }
.step .num { font:500 13px "JetBrains Mono", monospace; color:var(--accent); }
.step h3 { margin:0; font-size:24px; letter-spacing:-.02em; } .step p { margin:0; color:var(--ink2); font-size:15.5px; }
pre.mini { margin:auto 0 0; font-size:13px; line-height:1.6; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:14px 16px; color:var(--ink2); white-space:pre-wrap; }
pre.mini .ok { color:#4ade80; }
.features { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.feature { padding:24px; } .feature h3 { margin:0 0 8px; font-size:18px; } .feature p { margin:0; color:var(--ink2); font-size:15.5px; }

/* print-scale layout: a .col is one 5.5 in text column; children size in % of it */
.col { container-type:inline-size; position:relative; }
.row { display:flex; justify-content:center; align-items:flex-start; }
.row img { display:block; height:auto; }
.paper { background:#fff; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5); padding:7% 9%; }
.paper p { font:calc(100cqw * 10 / 72 / 5.5)/1.2 "Times New Roman", Times, serif; color:#222; text-align:justify; margin:0 0 .9em; hyphens:auto; }
.paper .row { margin:0; }
.paper.two .row { margin-top:.6em; }
.paper.two { padding:12% 9.19% 0; aspect-ratio:210 / 297; overflow:hidden; }
.paper.two .cols { display:grid; grid-template-columns:1fr 1fr; column-gap:calc(100% * 0.25 / 6.75); }
.paper.two .pcol { container-type:inline-size; }
.paper.two p { font-size:calc(100cqw * 10 / 72 / 3.25); }
.paper.two .fullfig { margin:0 0 1.2em; }
.paper.two p.lede { font-size:calc(100cqw * 10 / 72 / 6.75); }
.paper.two .fullfig p.cap { font-size:calc(100cqw * 9 / 72 / 6.75); }
.paper p.cap { font-size:calc(100cqw * 9 / 72 / 3.25); text-align:left; margin:.15em 0 .9em; }
.paper p.cap b { font-weight:700; }
.block { background:#fff; border-radius:12px; padding:4% 0; }
.block .row + .row { margin-top:3%; }
.guide { position:absolute; top:0; bottom:0; border-left:1.5px dashed #d7344a; opacity:.45; pointer-events:none; z-index:2; }
.guide.text { border-left-color:#2f6fd6; }
.compare .panes { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
.compare .pane { display:flex; flex-direction:column; }
.compare .pane > .block { flex:1; display:flex; flex-direction:column; justify-content:center; }
.compare .tag, .pv-pair figcaption { font-weight:600; font-size:14px; margin:0 0 12px; color:var(--grey); text-align:center; }
.compare .with .tag, .pv-pair .with figcaption { color:var(--accent); }
.compare .switch { display:none; }
.switch { display:flex; background:var(--panel); border:1px solid var(--line2); border-radius:11px; padding:3px; gap:2px; width:max-content; margin:0 auto 16px; }
.switch button { font:inherit; font-size:13.5px; font-weight:600; border:0; background:none; color:var(--ink3); padding:7px 12px; border-radius:8px; cursor:pointer; }
.switch button[aria-pressed="true"][data-v="with"] { background:var(--accent); color:#fff; }
.switch button[aria-pressed="true"][data-v="without"] { background:#3a3f49; color:#fff; }

/* gallery */
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
.ex { margin:0; padding:16px; display:flex; flex-direction:column; gap:12px; }
.ex figcaption { font-size:15px; line-height:1.35; text-align:center; } .ex figcaption span { display:block; color:var(--ink3); font-size:13px; margin-top:3px; }
.ex .switch { margin:0 auto; } .ex .switch button { font-size:12.5px; padding:5px 10px; }
.frame { background:#fff; border-radius:10px; padding:10px; display:grid; place-items:center; min-height:210px; }
.frame img { grid-area:1/1; max-width:100%; max-height:380px; height:auto; }
.ex[data-show="with"] .frame .without, .ex[data-show="without"] .frame .with { visibility:hidden; }

/* paper viewer: papers as tabs above, the two pages side by side across the full width */
.pv { display:flex; flex-direction:column; gap:18px; }
.pv-list { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.pv-list button { text-align:left; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; cursor:pointer; max-width:420px; transition:border-color .2s ease, background .2s ease; }
.pv-list button:hover { border-color:var(--line2); }
.pv-list button[aria-selected="true"] { border-color:rgba(255,77,99,.55); background:rgba(255,77,99,.08); }
.pv-list b { display:block; font-size:15px; line-height:1.35; } .pv-list span { display:block; margin-top:4px; font-size:12.5px; color:var(--ink3); font-family:"JetBrains Mono", monospace; }
.pv-bar { display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
.pv-pages { display:flex; gap:6px; flex-wrap:wrap; }
.pv-bar button { position:relative; font:inherit; font-size:14px; min-width:36px; height:36px; padding:0 8px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink2); cursor:pointer; }
.pv-bar button:hover { border-color:var(--line2); color:var(--ink); }
.pv-bar button[aria-current="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.pv-bar button.changed::after, .pv-note i { content:""; position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.pv-note { font-size:13px; color:var(--ink3); display:flex; align-items:center; gap:6px; margin-left:12px; }
.pv-note i { position:static; display:inline-block; }
.pv-pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.pv-pair figure { margin:0; }
.pv-pair a { display:block; cursor:zoom-in; }
.pv-pair img { display:block; width:100%; aspect-ratio:976/1560; background:#fff; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.pv-switch { display:none; }
.pv-credit { font-size:13px; color:var(--ink3); margin:4px 0 0; text-align:center; } .pv-credit a { color:var(--ink2); }
.compare .pane > .paper { flex:1; }  /* both pages as tall as the taller one */
.paper.two.align { aspect-ratio:auto; padding:calc(100% * 0.3 / 7.35); }  /* 0.3 in around the text block, as the paper viewer's pages */
/* the paper viewer's scale (559 px for its 6.1 in pages): 7.35 in pages, so this comparison leaves the text width */
@media (min-width:901px) { .compare[data-name="page"] { position:relative; left:50%; transform:translateX(-50%); width:min(1374px, calc(100vw - 64px)); } }
.paper.two.align .fullfig, .paper.two.align .cols { margin:0 0 5%; }
.paper.two.align > .col > :last-child { margin-bottom:0; }
/* faq */
.faq { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
.faq details { padding:0 22px; }
.faq summary { list-style:none; cursor:pointer; padding:20px 0; font-weight:600; font-size:17px; display:flex; justify-content:space-between; gap:16px; }
.faq summary::-webkit-details-marker { display:none; }
.faq summary::after { content:"+"; color:var(--ink3); font-weight:400; font-size:22px; line-height:1; transition:transform .2s ease; }
.faq details[open] summary::after { transform:rotate(45deg); }
.faq details p { margin:0 0 20px; color:var(--ink2); }

/* closing */
.closing { text-align:center; }
.closing { padding:120px 24px; }
.install { max-width:680px; margin:30px auto 0; position:relative; text-align:left; }
.install pre { margin:0; font-size:14.5px; background:var(--code); border:1px solid var(--line2); border-radius:14px; padding:20px 22px; overflow-x:auto; color:var(--ink); }
.copy { position:absolute; top:12px; right:12px; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink2); background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:5px 10px; cursor:pointer; }
footer { padding:44px 0 90px; color:var(--ink3); font-size:14px; }
footer .wrap { display:flex; gap:18px; flex-wrap:wrap; justify-content:space-between; border-top:1px solid var(--line); padding-top:28px; }
footer a { text-decoration:none; } footer a:hover { color:var(--ink); }

/* black-and-white switch */
.bwtoggle { position:fixed; right:22px; bottom:22px; z-index:20; display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:14px; font-weight:600; padding:11px 16px; border:1px solid var(--line2); border-radius:999px; background:rgba(17,20,26,.85); backdrop-filter:blur(10px); color:var(--ink); cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.4); }
.bwtoggle .bwicon { color:var(--accent); font-size:16px; line-height:1; }
html.bw body > *:not(.bwtoggle) { filter:grayscale(1); }

/* reveal on scroll, only when scripts run */
.js .reveal { opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; }
.js .reveal.in { opacity:1; transform:none; }
@media (prefers-reduced-motion: reduce) { .js .reveal { opacity:1; transform:none; transition:none; } .tl, .sheet img, .stage-tag span { transition:none; } }

@media (max-width:900px) {
  .demo-body { grid-template-columns:1fr; } .term { border-right:0; border-bottom:1px solid var(--line); min-height:260px; }
  .steps, .features { grid-template-columns:1fr; }
  .compare .panes, .pv-pair { grid-template-columns:1fr; }
  .compare .switch, .pv-switch { display:flex; }
  .compare .tag, .pv-pair figcaption { display:none; }
  .compare[data-show="with"] .pane.without, .compare[data-show="without"] .pane.with { display:none; }
  .pv-list { flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; } .pv-list button { min-width:240px; }
  .pv[data-show="with"] .pv-pair .without, .pv[data-show="without"] .pv-pair .with { display:none; }
  .pv-note { margin-left:0; width:100%; justify-content:center; }
  nav .opt { display:none; }
}
@media (max-width:560px) {
  .wrap { padding:0 16px; } .window-frame { inset:6px; border-radius:20px; }
  header { padding:120px 0 40px; } section { padding:72px 0; } .gallery { grid-template-columns:1fr; }
  nav { gap:12px; } nav .links { gap:12px; }
}

/* the same cards and grid as the layouts page: two print columns, image first */
.gallery { --p:0.0625in; display:grid; grid-template-columns:repeat(2, calc(3.25in + 2 * var(--p))); gap:18px calc(0.25in - 2 * var(--p));
  width:calc(6.75in + 2 * var(--p)); margin:0 auto; align-items:start; }
.ex { padding:var(--p); gap:10px; border:0; border-radius:14px; background:var(--panel); box-shadow:0 0 0 1px var(--line); }
.ex .frame { order:-1; padding:0; min-height:0; border-radius:8px; display:grid; }
.ex .frame img { width:100%; max-height:none; }
.ex figcaption { text-align:left; padding:2px 6px 0; }
.ex .switch { margin:0 6px 6px; align-self:flex-start; }
@media (max-width:720px) { .gallery { grid-template-columns:1fr; width:auto; } }
</style>
</head>

  </div>
  <div class="frame">

<figure class="ex" data-show="with">
  <figcaption><strong>Histogram</strong><span>Overlaid histograms of confidence</span></figcaption>
  <div class="mini switch" role="group" aria-label="Version">
    <button type="button" data-v="without" aria-pressed="false">Without</button>
    <button type="button" data-v="with" aria-pressed="true">With</button>
  </div>

<button type="button" class="bwtoggle" aria-pressed="false"><span class="bwicon">◐</span><span class="bwtext">See it in black &amp; white</span></button>
<script>
document.documentElement.classList.add("js");
document.querySelectorAll(".ex").forEach(box => {
  box.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
    box.dataset.show = b.dataset.v;
    box.querySelectorAll(".switch button").forEach(o => o.setAttribute("aria-pressed", o === b));
  }));
});
document.querySelector(".bwtoggle").addEventListener("click", e => {
  const on = document.documentElement.classList.toggle("bw");
  e.currentTarget.setAttribute("aria-pressed", on);
  e.currentTarget.querySelector(".bwtext").textContent = on ? "Back to color" : "See it in black & white";
});
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }));
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
setTimeout(() => document.querySelectorAll(".reveal").forEach(el => el.classList.add("in")), 2500);
</script>
