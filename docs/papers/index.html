  <div class="pv-list" role="tablist" aria-label="Paper"><button type="button" role="tab" data-i="0" aria-selected="true"><b>SFT Memorizes, RL Generalizes</b><span>ICML 2025</span></button><button type="button" role="tab" data-i="1" aria-selected="false"><b>nGPT: Normalized Transformer</b><span>ICLR 2025</span></button><button type="button" role="tab" data-i="2" aria-selected="false"><b>On the Interplay of Pre-Training, Mid-Training, and RL</b><span>ICML 2026</span></button></div>

<script>
const PAPERS = [{"id": "2501.17161", "ratio": "612.0 / 792.0", "credit": "Chu et al., SFT Memorizes, RL Generalizes: A Comparative Study of Foundation Model Post-training, ICML 2025. <a href=\"https://arxiv.org/abs/2501.17161\" target=\"_blank\" rel=\"noopener\">arXiv:2501.17161</a>, <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>. Every data plot in the main text redrawn by academic-figure from values recovered from the PDF, then the paper recompiled from its arXiv source; text and captions unchanged.", "pages": [{"n": 7, "on": 7, "o": "2501.17161/original/p7.svg?v=d4e750abf7", "r": "2501.17161/redrawn/p7.svg?v=bb47ac69ef"}, {"n": 8, "on": 8, "o": "2501.17161/original/p8.svg?v=05174ac439", "r": "2501.17161/redrawn/p8.svg?v=111d6745b6"}, {"n": 9, "on": 9, "o": "2501.17161/original/p9.svg?v=f83ec8f61c", "r": "2501.17161/redrawn/p9.svg?v=afb210d992"}]}, {"id": "2410.01131", "ratio": "612.0 / 792.0", "credit": "Loshchilov et al., nGPT: Normalized Transformer with Representation Learning on the Hypersphere, ICLR 2025. <a href=\"https://arxiv.org/abs/2410.01131\" target=\"_blank\" rel=\"noopener\">arXiv:2410.01131</a>, <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>. Every data plot in the main text redrawn by academic-figure from values recovered from the PDF, then the paper recompiled from its arXiv source; text and captions unchanged.", "pages": [{"n": 7, "on": 7, "o": "2410.01131/original/p7.svg?v=a4c124e4f5", "r": "2410.01131/redrawn/p7.svg?v=8e62925889"}, {"n": 8, "on": 8, "o": "2410.01131/original/p8.svg?v=f615acd565", "r": "2410.01131/redrawn/p8.svg?v=6cf2b00460"}, {"n": 9, "on": 9, "o": "2410.01131/original/p9.svg?v=a1a8063517", "r": "2410.01131/redrawn/p9.svg?v=e859e59fa3"}, {"n": 10, "on": 10, "o": "2410.01131/original/p10.svg?v=9ddc2ad80b", "r": "2410.01131/redrawn/p10.svg?v=9216f0f93b"}, {"n": 11, "on": 11, "o": "2410.01131/original/p11.svg?v=b85e041c86", "r": "2410.01131/redrawn/p11.svg?v=10437d6a3a"}]}, {"id": "2512.07783", "ratio": "595.280029296875 / 841.8900146484375", "credit": "Zhang et al., On the Interplay of Pre-Training, Mid-Training, and RL on Reasoning Language Models, ICML 2026. <a href=\"https://arxiv.org/abs/2512.07783\" target=\"_blank\" rel=\"noopener\">arXiv:2512.07783</a>, arXiv non-exclusive license. Every data plot in the main text redrawn by academic-figure from values recovered from the PDF, then the paper recompiled from its arXiv source; text and captions unchanged.", "pages": [{"n": 5, "on": 5, "o": "2512.07783/original/p5.svg?v=174b8fb587", "r": "2512.07783/redrawn/p5.svg?v=16f6ed454b"}, {"n": 7, "on": 7, "o": "2512.07783/original/p7.svg?v=4d65c6999d", "r": "2512.07783/redrawn/p7.svg?v=17aa9fcfc0"}, {"n": 8, "on": 8, "o": "2512.07783/original/p8.svg?v=8472ba0848", "r": "2512.07783/redrawn/p8.svg?v=324ccb867e"}, {"n": 10, "on": 10, "o": "2512.07783/original/p10.svg?v=8aa5e2b09a", "r": "2512.07783/redrawn/p10.svg?v=84be94dd2e"}]}];
(() => {
  const pv = document.querySelector(".pv");
  const pagesEl = pv.querySelector(".pv-pages");
  const [orig, redrawn] = pv.querySelectorAll(".pv-pair img");
  let paper = 0, page = 0;
  function show() {
    const p = PAPERS[paper];
    pagesEl.innerHTML = p.pages.map((pg, i) => `<button type="button" data-p="${i}" aria-current="${i === page}">p. ${pg.n}${pg.on !== pg.n ? ` (orig. ${pg.on})` : ""}</button>`).join("");
    [[orig, p.pages[page].o], [redrawn, p.pages[page].r]].forEach(([img, url]) => {
      img.style.visibility = url ? "visible" : "hidden";
      img.style.aspectRatio = p.ratio;
      if (url) { img.src = url; img.parentElement.href = url; }
    });
    pv.querySelector(".pv-credit").innerHTML = p.credit;
    pv.querySelectorAll(".pv-list button").forEach((b, i) => b.setAttribute("aria-selected", i === paper));
    [page - 1, page + 1].filter(i => p.pages[i]).forEach(i => [p.pages[i].o, p.pages[i].r].filter(Boolean).forEach(u => { new Image().src = u; }));
  }
  pv.querySelectorAll(".pv-list button").forEach(b => b.addEventListener("click", () => { paper = +b.dataset.i; page = 0; show(); }));
  pagesEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { page = +b.dataset.p; show(); } });
  pv.querySelector(".pv-prev").addEventListener("click", () => { page = Math.max(0, page - 1); show(); });
  pv.querySelector(".pv-next").addEventListener("click", () => { page = Math.min(PAPERS[paper].pages.length - 1, page + 1); show(); });
  show();
})();
</script>
